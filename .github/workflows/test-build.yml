name: Test build

# A throwaway Debug build of this branch, ad-hoc signed, for trying the palette typing-lag fix.
on:
  push:
    branches: [palette-typing-lag]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner."
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package ZIP
        run: |
          mkdir -p dist
          ditto -c -k --keepParent --sequesterRsrc \
            "$RUNNER_TEMP/DerivedData/Build/Products/Debug/Tinycast Dev.app" "dist/Tinycast-Dev.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: Tinycast-Dev
          path: dist/

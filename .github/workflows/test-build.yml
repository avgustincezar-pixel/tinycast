name: Test build

# A side-by-side "Tinycast Test" app, ad-hoc signed, so a fix can be tried without Xcode.
on:
  push:
    branches: [fix/palette-typing-lag, feat/clipboard-screenshots]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner."
            ls /Applications | grep -i xcode || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            PRODUCT_NAME="Tinycast Test" TINYCAST_BUNDLE_IDENTIFIER="com.tinycast.app.test" \
            build

      # A DMG keeps the bundle's symlinks and exec bits, which a zipped artifact can mangle.
      - name: Make DMG
        run: |
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release" -maxdepth 1 -name '*.app' | head -n1)"
          STAGE="$RUNNER_TEMP/dmg"
          mkdir -p "$STAGE"
          ditto "$APP" "$STAGE/$(basename "$APP")"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Tinycast Test" -srcfolder "$STAGE" -ov -format UDZO \
            "$RUNNER_TEMP/Tinycast-Test.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: Tinycast-Test
          path: ${{ runner.temp }}/Tinycast-Test.dmg

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$RUNNER_TEMP/Tinycast-Test.dmg" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Tinycast Test ($GITHUB_REF_NAME #$GITHUB_RUN_NUMBER)" \
            --notes "Unsigned test build of $GITHUB_REF_NAME at $GITHUB_SHA."
